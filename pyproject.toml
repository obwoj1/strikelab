[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strikelab"
version = "0.1.0"
description = "Evaluate soccer shots from video: verdict, speed, placement and shot quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["soccer", "football", "computer-vision", "sports-analytics", "yolo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
yolo = ["ultralytics>=8.3", "opencv-python>=4.8"]
roboflow = ["inference>=0.9", "opencv-python>=4.8"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "opencv-python>=4.8"]
dev = ["pytest>=8.0", "opencv-python-headless>=4.8", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
strikelab = "strikelab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strikelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
